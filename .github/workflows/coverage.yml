name: Codecov upload
run-name: Codecov upload from CI run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run ID with an unexpired coverage-linux artifact (master or latest)
        type: string
        required: true

permissions:
  contents: read

jobs:
  coverage:
    name: Upload existing Linux coverage without tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source CI run and resolve coverage revision
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_RUN_ID: ${{ inputs.run_id }}
        run: python3 -B tools/coverage_retry.py
      - name: Download only the original coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-linux
          path: .ci/coverage/
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Require a completed nonempty report
        run: test -s .ci/coverage/lcov.info
      - name: Upload Rust line coverage to Codecov
        uses: ./.github/actions/coverage
        with:
          commit: ${{ steps.source.outputs.commit }}
          branch: ${{ steps.source.outputs.branch }}
