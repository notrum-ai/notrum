[package]
name = "notrum-security"
version = "0.1.0"
edition = "2024"
publish = false
license.workspace = true
authors.workspace = true

[features]
test-utils = ["notrum-secure/test-utils"]

[lib]
path = "src/lib.rs"

[dependencies]
notrum-engine = { version = "0.1.0", path = "../notrum-engine" }
notrum-secure = { version = "0.1.0", path = "../notrum-secure" }
rand = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.8.1"
